name: XAUUSD Daily Signal
on: schedule: - cron: "0 0 * * *" workflow_dispatch:
jobs: signal: runs-on: ubuntu-latest
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Run XAUUSD Bot
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    run: |
      python bot.py
